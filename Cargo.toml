[workspace]
exclude = ["vendor/cfg_aliases"]
members = ["kv-engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["ben1009"]
edition = "2024"
homepage = "https://github.com/ben1009/toy-kv-engine"
keywords = ["storage", "database"]
license = "Apache-2.0"
repository = "https://github.com/ben1009/toy-kv-engine"

[workspace.dependencies]
anyhow = "1"
bytes = "1"

# Local patch for nix 0.31.3's build-time cfg_aliases use on nightly-2026-08-20
# until upstream cfg_aliases is bumped past the trailing-semicolon macro issue
# tracked by rust-lang/rust#79813.
[patch.crates-io]
cfg_aliases = { path = "vendor/cfg_aliases" }
